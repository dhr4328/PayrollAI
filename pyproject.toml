[project]
name = "rag-payroll"
version = "0.1.0"
description = "Payroll AI & HR Management Platform Backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.5",
    "uvicorn[standard]>=0.32.1",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.36",
    "openai>=1.57.4",
    "pymupdf>=1.25.3",
    "openpyxl>=3.1.5",
    "python-docx>=1.1.2",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic>=2.10.3",
    "pydantic-settings>=2.6.1",
    "python-dotenv>=1.0.1",
    "httpx>=0.28.0",
    "aiofiles>=24.1.0",
    "pandas>=2.2.3",
    "numpy>=1.26.4",
    "fastapi-mail>=1.4.2",
    "reportlab>=4.2.5"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.vercel]
entrypoint = "backend.main:app"


